tasks:
  build:docker:
    cmds:
      - |
        set -eu
        cd ../..
        set --
        if [ "${STROLT_BINARY_ARTIFACT+x}" = x ]; then
          if [ -z "$STROLT_BINARY_ARTIFACT" ]; then
            echo "STROLT_BINARY_ARTIFACT must not be empty" >&2
            exit 1
          fi
          python3 .github/scripts/release.py stage-binaries \
            "$STROLT_BINARY_ARTIFACT" strolt linux/amd64
          set -- --platform linux/amd64
        else
          RELEASE_VERSION=development \
            python3 .github/scripts/release.py local-binaries - strolt
        fi
        "${DOCKER_BIN:-docker}" build "$@" \
          -f docker/strolt/Dockerfile \
          --build-arg RELEASE_VERSION=development \
          -t strolt/strolt:development .
    desc: Stage or build the GoReleaser binary and local Strolt image
  test:
    cmds:
      - pnpm dm exec go -- test {{.NON_E2E_PACKAGES}}
    desc: Run Strolt tests, excluding E2E
  test:coverage:
    cmds:
      - sh -c 'trap "rm -f coverage.strolt.out" EXIT; pnpm dm exec go -- test -coverprofile=coverage.strolt.out {{.NON_E2E_PACKAGES}} && pnpm dm exec go -- tool cover -func=coverage.strolt.out'
    desc: Run all Strolt tests and report coverage
  test:e2e:
    cmds:
      - |
        set -eu
        if [ "${STROLT_TEST_IMAGE+x}" = x ]; then
          if [ -z "$STROLT_TEST_IMAGE" ]; then
            echo "STROLT_TEST_IMAGE must not be empty" >&2
            exit 1
          fi
        elif [ "${STROLT_BINARY_ARTIFACT+x}" = x ]; then
          echo "STROLT_TEST_IMAGE is required with STROLT_BINARY_ARTIFACT" >&2
          exit 1
        else
          DOCKER_BIN="{{.DOCKER_BIN}}" pnpm run build:docker
        fi
      - |
        set -eu
        DOCKER_BIN="{{.DOCKER_BIN}}"
        if [ "${STROLT_TEST_IMAGE+x}" = x ]; then
          image_id="$STROLT_TEST_IMAGE"
        else
          image_id="$($DOCKER_BIN image ls --no-trunc --quiet strolt/strolt:development)"
        fi
        if [ -z "$image_id" ]; then
          echo "failed to resolve built Strolt image ID" >&2
          exit 1
        fi
        STROLT_TEST_IMAGE="$image_id" GOFLAGS="-count=1" \
          pnpm dm exec go -- test ./e2e -v -timeout 30m
    desc: Build the Strolt image and run all end-to-end tests
    vars:
      DOCKER_BIN:
        sh: |
          for candidate in /usr/bin/docker /usr/local/bin/docker /opt/homebrew/bin/docker; do
            if [ -x "$candidate" ]; then
              printf '%s\n' "$candidate"
              exit 0
            fi
          done
          command -v docker
vars:
  NON_E2E_PACKAGES:
    sh: |
      if ! packages=$(pnpm dm exec go -- list ./...); then
        echo "failed to discover Strolt Go packages" >&2
        exit 1
      fi
      if [ -z "$packages" ]; then
        echo "go list ./... returned no packages" >&2
        exit 1
      fi
      set --
      while IFS= read -r package; do
        case "$package" in
          */e2e | */e2e/*) continue ;;
        esac
        set -- "$@" "$package"
      done << EOF
      $packages
      EOF
      if [ "$#" -eq 0 ]; then
        echo "go list ./... returned no non-E2E packages" >&2
        exit 1
      fi
      printf '%s ' "$@"
version: "3"
