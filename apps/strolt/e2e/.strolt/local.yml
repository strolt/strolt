services:
  e2e:
    local:
      destinations:
        restic-local:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/restic-local"
          extends: restic_base
      source:
        config:
          path: "/e2e/input"
        driver: local
    local-dest:
      destinations:
        plain-local:
          config:
            path: "/e2e/local-dest"
          driver: local
      source:
        config:
          path: "/e2e/input"
        driver: local
