# Deliberately not extending restic_base: the inherited keep.last would
# change which snapshots survive the time-bucket retention test.
services:
  e2e:
    retention:
      destinations:
        restic-retention:
          config:
            keep:
              daily: 1
              hourly: 2
          driver: restic
          env:
            AWS_ACCESS_KEY_ID: "{{.RESTIC_AWS_ACCESS_KEY_ID}}"
            AWS_SECRET_ACCESS_KEY: "{{.RESTIC_AWS_SECRET_ACCESS_KEY}}"
            RESTIC_PASSWORD: "{{.RESTIC_PASSWORD}}"
            RESTIC_REPOSITORY: "s3:http://minio:9000/restic-retention"
      source:
        config:
          path: "/e2e/input"
        driver: local
