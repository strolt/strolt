services:
  e2e:
    mysql:
      destinations:
        restic-mysql:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/restic-mysql"
          extends: restic_base
      source:
        config:
          database: "{{.MYSQL_DATABASE}}"
          host: mysql
          password: "{{.MYSQL_PASSWORD}}"
          username: "{{.MYSQL_USER}}"
        driver: mysql
