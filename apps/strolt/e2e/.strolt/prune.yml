services:
  e2e:
    prune:
      destinations:
        restic-prune:
          config:
            keep:
              last: 3
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/restic-prune"
          extends: restic_base
      source:
        config:
          path: "/e2e/input"
        driver: local
