services:
  e2e:
    mariadb:
      destinations:
        restic-mariadb:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/restic-mariadb"
          extends: restic_base
      source:
        config:
          database: "{{.MYSQL_MARIADB_DATABASE}}"
          host: mariadb
          password: "{{.MYSQL_MARIADB_PASSWORD}}"
          username: "{{.MYSQL_MARIADB_USER}}"
        driver: mysql
  e2e-copy:
    mariadb:
      destinations:
        restic-mariadb:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/copy/restic-mariadb"
          extends: restic_base
      operationMode: copy
      source:
        config:
          database: "{{.MYSQL_MARIADB_DATABASE}}"
          host: mariadb
          password: "{{.MYSQL_MARIADB_PASSWORD}}"
          username: "{{.MYSQL_MARIADB_USER}}"
        driver: mysql
