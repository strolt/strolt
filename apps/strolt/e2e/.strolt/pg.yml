services:
  e2e:
    pg-c:
      destinations:
        restic-pg-c:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/restic-pg-c"
          extends: restic_base
      source:
        config:
          database: "{{.PG_DATABASE}}"
          format: c
          host: postgres
          password: "{{.PG_PASSWORD}}"
          username: "{{.PG_USER}}"
        driver: pg
    pg-d:
      destinations:
        restic-pg-d:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/restic-pg-d"
