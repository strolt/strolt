name: strolt-e2e
services:
  mariadb:
    image: mariadb:11.4.13
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      MYSQL_DATABASE: strolt
      MYSQL_PASSWORD: strolt # pragma: allowlist secret
      MYSQL_ROOT_PASSWORD: strolt # pragma: allowlist secret
      MYSQL_USER: strolt
      TZ: UTC
    ports:
      - "127.0.0.1:9004:3306"
    networks:
      - strolt
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_PASSWORD: minioadmin # pragma: allowlist secret
      MINIO_ROOT_USER: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - strolt
    command: server --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 /data
  mongo:
    image: mongo:9.0.4
    volumes:
      - mongo:/data/db
    ports:
      - "127.0.0.1:9003:27017"
    networks:
      - strolt
  postgres:
    image: postgres:18.6-alpine3.23
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: strolt
      POSTGRES_PASSWORD: strolt # pragma: allowlist secret
      POSTGRES_USER: strolt
      TZ: UTC
    ports:
      - "127.0.0.1:9002:5432"
    networks:
      - strolt
  strolt:
    image: strolt/strolt:development # dclint disable-line service-image-require-explicit-tag — locally built via `make docker-strolt`, never pulled from a registry
    volumes:
      - ./strolt.yml:/strolt/config.yml:ro
      - ./.strolt:/strolt/.strolt:ro
      - ./.temp/input:/e2e/input
    networks:
      - strolt
networks:
  strolt:
    external: true
volumes:
  mariadb:
  minio:
  mongo:
  postgres:
