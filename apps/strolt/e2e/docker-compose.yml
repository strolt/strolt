networks:
  strolt:
    external: true

services:
  mariadb:
    environment:
      MYSQL_DATABASE: strolt
      MYSQL_PASSWORD: strolt #pragma: allowlist secret
      MYSQL_ROOT_PASSWORD: strolt #pragma: allowlist secret
      MYSQL_USER: strolt
      TZ: UTC
    image: mariadb:10.8.3
    networks:
      - strolt

    ports:
      - 9004:3306
    volumes:
      - mariadb:/var/lib/mysql
  minio:
    command: server --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 /data
    environment:
      MINIO_ROOT_PASSWORD: minioadmin #pragma: allowlist secret
      MINIO_ROOT_USER: minioadmin
    image: minio/minio:RELEASE.2022-08-13T21-54-44Z
    networks:
      - strolt

    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/data
  mongo:
    environment:
      - PUID=1000
      - PGID=1000
    image: mongo:4.4.15
    networks:
      - strolt

    ports:
      - 9003:27017
    volumes:
      - mongo:/data/db
  postgres:
    environment:
      POSTGRES_DB: strolt
      POSTGRES_PASSWORD: strolt #pragma: allowlist secret
      POSTGRES_USER: strolt
      TZ: UTC
    image: postgres:15.17-alpine3.23
    networks:
      - strolt

    ports:
      - 9002:5432
    volumes:
      - postgres:/var/lib/postgresql/data
  strolt:
    image: strolt/strolt:development
    networks:
      - strolt

    volumes:
      - ./strolt.yml:/strolt/config.yml:ro
      - ./.strolt:/strolt/.strolt:ro
      - ./.temp/input:/e2e/input
volumes:
  mariadb:
  minio:
  mongo:
  mysql:
  postgres:
