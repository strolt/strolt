formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
linters:
  default: all
  disable:
    - containedctx
    - copyloopvar
    - cyclop
    - funcorder
    - depguard
    - dupl
    - nilnesserr
    - unqueryvet
    - noctx
    - err113
    - noinlineerr
    - modernize
    - embeddedstructfieldcheck
    - wsl_v5
    - wsl
    - prealloc
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gocognit
    - gocyclo
    - godox
    - gosec
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - musttag
    - nestif
    - paralleltest
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testifylint
    - testpackage
    - varnamelen
    - wastedassign
    - wrapcheck
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
  settings:
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G204
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - DriverDestinationInterface
        - DriverNotificationInterface
        - DriverSourceInterface
    mnd:
      ignored-functions:
        - ParseInt
      ignored-numbers:
        - "0o700"
    nlreturn:
      block-size: 2
    revive:
      rules:
        - disabled: true
          name: unused-parameter
          severity: warning
run:
  go: 1.24.0
version: "2"
