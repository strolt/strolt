tasks:
  codegen:
    cmds:
      - pnpm dm exec openapi-generator -- generate -i ../../../.swagger/stroltm/swagger.json -g typescript-axios -o ./src/api/generated
      - node ./scripts/fix-generated-api.mjs
    desc: Generate and fix the OpenAPI API client
  generate:
    deps:
      - codegen
    desc: Refresh the committed OpenAPI client
version: "3"
