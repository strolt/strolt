tasks:
  build:
    cmds:
      - pnpm dm exec go -- build
    desc: Build the manager binary
  build:docker:
    cmds:
      - pnpm --filter stroltm-ui build
      - pnpm --filter @strolt/stroltm build:lib
      - |
        set -eu
        cd ../..
        if [ "${STROLT_BINARY_ARTIFACT+x}" = x ]; then
          if [ -z "$STROLT_BINARY_ARTIFACT" ]; then
            echo "STROLT_BINARY_ARTIFACT must not be empty" >&2
            exit 1
          fi
          python3 .github/scripts/release.py stage-binaries \
            "$STROLT_BINARY_ARTIFACT" stroltm linux/amd64
          set -- --platform linux/amd64
        else
          RELEASE_VERSION=development python3 .github/scripts/release.py local-binaries - stroltm
          set --
        fi
        "${DOCKER_BIN:-docker}" build "$@" \
          -f docker/stroltm/Dockerfile \
          --build-arg RELEASE_VERSION=development \
          -t strolt/stroltm:development .
    desc: Build the manager UI and local image from source or a GoReleaser bundle
  build:lib:
    cmds:
      - rm -rf internal/ui/build/dist
      - cp -R ui/dist internal/ui/build/dist
    desc: Copy the Turbo-built UI into the manager embedding path
  clean:
    cmds:
      - rm -f stroltm
      - rm -rf internal/ui/build/dist ui/dist
    desc: Remove manager build outputs
  run:
    cmds:
      - pnpm dm exec go -- build -ldflags "-X github.com/strolt/strolt/apps/stroltm/internal/ui.mode=proxy"
      - STROLTM_PORT=8090 ./stroltm --config=./testdata/stroltm.yml
    desc: Run the manager with its local config
  run-debug:
    cmds:
      - pnpm dm exec go -- build -ldflags "-X github.com/strolt/strolt/apps/stroltm/internal/ui.mode=proxy"
      - STROLTM_LOG_LEVEL=DEBUG STROLTM_PORT=8090 ./stroltm --config=./testdata/stroltm.yml
    desc: Run the manager with debug logging
version: "3"
