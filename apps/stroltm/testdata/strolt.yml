api:
  users:
    admin: admin

definitions:
  destinations:
    restic_base:
      config:
        keep:
          last: 3
      driver: restic
      env:
        AWS_ACCESS_KEY_ID: minioadmin
        AWS_SECRET_ACCESS_KEY: minioadmin #pragma: allowlist secret

        RESTIC_PASSWORD: strolt #pragma: allowlist secret
        RESTIC_REPOSITORY: s3:http://minio:9000/restic-pg-t
  notifications:
    terminal:
      driver: console
      events:
        - OPERATION_START
        - OPERATION_STOP
        - OPERATION_ERROR
        - SOURCE_START
        - SOURCE_STOP
        - SOURCE_ERROR
        - DESTINATION_START
        - DESTINATION_STOP
        - DESTINATION_ERROR
name: stroltm
services:
  e2e:
    pg-t:
      destinations:
        restic-pg-t:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/e2e/restic-pg-t"
          extends: restic_base
      source:
        config:
          database: strolt
          format: t
          host: postgres
          password: strolt #pragma: allowlist secret
          username: strolt
        driver: pg
      tags:
        - tag_from_task_config
      # notifications:
      #   - terminal
  e2e2:
    pg-t:
      destinations:
        restic-pg-t:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/e2e2/restic-pg-t"
          extends: restic_base
      notifications:
        - terminal
      source:
        config:
          database: strolt
          format: t
          host: postgres
          password: strolt #pragma: allowlist secret
          username: strolt
        driver: pg
    pg-t2:
      destinations:
        restic-pg-t:
          env:
            RESTIC_REPOSITORY: "s3:http://minio:9000/e2e2/restic-pg-t2"
          extends: restic_base
      notifications:
        - terminal

      source:
        config:
          database: strolt
          format: t
          host: postgres
          password: strolt #pragma: allowlist secret
          username: strolt
        driver: pg
tags:
  - tag_from_root_config

timezone: UTC
