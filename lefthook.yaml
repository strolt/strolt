glob_matcher: doublestar
pre-commit:
  commands:
    check-merge-conflicts:
      priority: 3
      run: "if git diff --cached --diff-filter=ACMR | grep -nE '^\\+(<{7} |={7}$|>{7} )'; then echo 'merge conflict markers found in staged changes'; exit 1; fi"
    check-large-files:
      priority: 4
      run: "git diff --cached --name-only --diff-filter=ACMR | grep -v -e '-lock\\.yaml$' -e '-lock\\.json$' | while read -r file; do\n  if [ -f \"$file\" ] && [ \"$(wc -c < \"$file\")\" -gt 512000 ]; then\n    echo \"file larger than 500KB: $file\"\n    exit 1\n  fi\ndone\n"
    swagger:
      glob: apps/{strolt,stroltm}/internal/api/**/*.go
      priority: 5
      run: make swagger && git add shared/sdk apps/stroltm/ui/src/api/generated
    test-strolt:
      glob:
        - apps/strolt/**
        - shared/**
      priority: 6
      run: make .test-strolt
    test-stroltm:
      glob:
        - apps/stroltm/**
        - shared/**
      priority: 7
      run: make .test-stroltm
    test-stroltp:
      glob:
        - apps/stroltp/**
        - shared/**
      priority: 8
      run: make .test-stroltp
    typecheck-stroltm-ui:
      glob: apps/stroltm/ui/**
      priority: 9
      run: make .lint-stroltm-ui
    datamitsu-init:
      priority: 10
      run: pnpm datamitsu init
    datamitsu-check:
      priority: 40
      run: pnpm datamitsu check --file-scoped
      stage_fixed: true
  parallel: false
commit-msg:
  commands:
    lint commit message:
      run: "pnpm datamitsu exec commitlint -- --edit {1}"
post-checkout:
  commands:
    install deps:
      priority: 1
      run: pnpm i -y
    init datamitsu:
      priority: 2
      run: pnpm datamitsu init
  parallel: false
