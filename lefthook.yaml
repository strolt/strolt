commit-msg:
  commands:
    lint commit message:
      run: "pnpm datamitsu exec commitlint -- --edit {1}"
post-checkout:
  commands:
    init datamitsu:
      priority: 2
      run: pnpm datamitsu init
    install deps:
      priority: 1
      run: pnpm i
pre-commit:
  commands:
    check-large-files:
      priority: 4
      run: |
        git diff --cached --name-only --diff-filter=ACMR | while read -r file; do
          if [ -f "$file" ] && [ "$(wc -c < "$file")" -gt 512000 ]; then
            echo "file larger than 500KB: $file"
            exit 1
          fi
        done
    check-merge-conflicts:
      priority: 3
      run: "if git diff --cached --diff-filter=ACMR | grep -nE '^\\+(<{7} |={7}$|>{7} )'; then echo 'merge conflict markers found in staged changes'; exit 1; fi"
    datamitsu-check:
      priority: 2
      run: pnpm datamitsu check --file-scoped
      stage_fixed: true
    datamitsu-init:
      priority: 1
      run: pnpm datamitsu init
    swagger:
      glob: "apps/{strolt,stroltm}/internal/api/**/*.go"
      priority: 5
      run: make swagger && git add shared/sdk apps/stroltm/ui/src/api/generated
    test-strolt:
      glob:
        - "apps/strolt/**"
        - "shared/**"
      priority: 6
      run: make .test-strolt
    test-stroltm:
      glob:
        - "apps/stroltm/**"
        - "shared/**"
      priority: 7
      run: make .test-stroltm
    test-stroltp:
      glob:
        - "apps/stroltp/**"
        - "shared/**"
      priority: 8
      run: make .test-stroltp
    typecheck-stroltm-ui:
      glob: "apps/stroltm/ui/**"
      priority: 9
      run: make .lint-stroltm-ui
  parallel: false
