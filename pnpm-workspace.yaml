allowBuilds:
  "@nestjs/core": false
  "@swc/core": false
  core-js: false
  core-js-pure: false
  esbuild: false
audit:
  level: high
autoInstallPeers: true
blockExoticSubdeps: true
catalog:
  "@shibanet0/datamitsu-config": 0.0.0-unstable.20261119.c3841f0
dangerouslyAllowAllBuilds: false
dedupeDirectDeps: true
dedupePeerDependents: true
enableGlobalVirtualStore: true
enablePrePostScripts: false
engineStrict: true
hoistPattern: []
lockfile: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@datamitsu/*"
  - "@ovineko/*"
  - "@shibanet0/*"
optimisticRepeatInstall: true
overrides:
  "@docusaurus/bundler@3.9.2>webpackbar@^6.0.1": 7.0.0
packageExtensions:
  "@redocly/openapi-core@1.16.0":
    dependencies:
      path-browserify: 1.0.1
  docusaurus-plugin-redoc@2.5.0:
    dependencies:
      "@docusaurus/utils-validation": 3.9.2
  redoc@2.4.0:
    dependencies:
      call-me-maybe: 1.0.2
      fast-safe-stringify: 2.1.1
      yaml: 1.10.3
packages:
  - apps/*
  - apps/stroltm/ui
  - shared
  - website
  - .github/scripts
preferFrozenLockfile: true
resolutionMode: lowest-direct
savePrefix: ""
strictDepBuilds: true
strictSsl: true
trustLockfile: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - detect-port@1.6.1
  - semver@6.3.1
  - undici-types@6.21.0
unsafePerm: false
updateNotifier: false
verifyDepsBeforeRun: install
verifyStoreIntegrity: true
