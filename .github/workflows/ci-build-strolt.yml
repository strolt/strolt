name: build-strolt
on:
  pull_request:
    paths:
      - ".github/workflows/ci-build-strolt.yml"
      - "apps/strolt/**"
      - ".dockerignore"
      - "!**.md"
  push:
    branches:
    paths:
      - ".github/workflows/ci-build-strolt.yml"
      - "apps/strolt/**"
      - ".dockerignore"
      - "!**.md"
    tags:
