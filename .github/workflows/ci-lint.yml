jobs:
  gates:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.19.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Swagger and SDK code
        run: pnpm generate
      - name: Check generated UI API client
        run: |
          git diff --exit-code -- apps/stroltm/ui/src/api/generated
          untracked="$(git ls-files --others --exclude-standard -- apps/stroltm/ui/src/api/generated)"
          if [ -n "$untracked" ]; then
            echo "Generated UI API client contains untracked files" >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          fi
      - name: Test workspace
        run: pnpm test
      - name: Lint workspace
        run: pnpm dm lint --fail-fast=false
      - name: Build documentation
        run: pnpm --filter website build
name: lint
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
permissions:
  contents: read
