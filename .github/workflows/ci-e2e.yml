jobs:
  e2e-strolt:
    name: e2e (strolt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          cache-dependency-path: apps/strolt/go.sum
          go-version-file: apps/strolt/go.mod
      - name: run e2e suite
        run: make e2e
    timeout-minutes: 40
name: e2e
on:
  pull_request:
    paths:
      - ".github/workflows/ci-e2e.yml"
      - "apps/strolt/**"
      - "shared/**"
      - "docker/strolt/**"
      - "Makefile"
      - "!**.md"
  push:
    branches:
      - main
permissions:
  contents: read
